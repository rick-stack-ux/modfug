
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQ-SPEC 1500</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Contenedor principal que simula la pantalla exacta de la foto */
        .device-screen {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 750px;
            background-color: #0f1418;
            border: 4px solid #1a2228;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        /* --- BARRA SUPERIOR --- */
        .top-bar {
            background: linear-gradient(to right, #131b22, #1b2631, #131b22);
            border: 1px solid #283845;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            font-size: 0.95rem;
            color: #d0e0f0;
            letter-spacing: 0.5px;
        }

        .top-status {
            color: #a0c0d0;
        }

        .top-icons {
            display: flex;
            gap: 15px;
            font-size: 1rem;
        }

        /* --- CUERPO PRINCIPAL (DISEÑO DE 3 COLUMNAS) --- */
        .main-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 85px 1fr 85px;
            grid-template-rows: 62% 38%;
            gap: 6px;
        }

        /* Panel Izquierdo (Botones) */
        .left-panel {
            grid-row: 1 / 3;
            background-color: #12181f;
            border: 1px solid #283845;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 15px 0;
        }

        /* Panel Derecho (Botones) */
        .right-panel {
            grid-row: 1 / 3;
            background-color: #12181f;
            border: 1px solid #283845;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 15px 0;
        }

        /* Botón Táctil Estilo UI Industrial */
        .ui-btn {
            background: transparent;
            border: none;
            color: #70b0c0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 6px;
            width: 100%;
            padding: 10px 0;
            transition: color 0.2s;
        }

        .ui-btn:hover, .ui-btn.active {
            color: #00d2ff;
        }

        .ui-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .ui-btn span {
            font-size: 0.72rem;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* --- ZONA SUPERIOR: ESPECTROGRAMA --- */
        .spectrogram-container {
            grid-column: 2;
            background-color: #000000;
            border: 1px solid #283845;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- ZONA INFERIOR: GRÁFICO DE TUBERÍA Y VALORES --- */
        .pipe-container {
            grid-column: 2;
            background-color: #12181f;
            border: 1px solid #283845;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 15px 12px 15px;
            position: relative;
        }

        .sensor-node-label {
            text-align: center;
            font-size: 0.7rem;
            color: #7090a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Gráfico vectorial de la tubería idéntico a la imagen */
        .pipe-graphic-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pipe-drawing {
            width: 75%;
            max-width: 480px;
            height: 30px;
            background: linear-gradient(to bottom, #5a7080 0%, #30404c 50%, #1a252e 100%);
            border-top: 2px solid #8fa8b8;
            border-bottom: 2px solid #141c24;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Válvula central con bridas y nodo */
        .pipe-valve {
            position: absolute;
            width: 46px;
            height: 52px;
            background: #3c505e;
            border: 2px solid #9fb0be;
            top: -11px;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .node-dot {
            width: 9px;
            height: 9px;
            background-color: #00e5ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e5ff;
            margin-bottom: 2px;
        }

        /* Texto de Amplitud central */
        .amplitude-display {
            position: absolute;
            bottom: 2px;
            text-align: center;
            font-size: 0.7rem;
            color: #8fa0b0;
            letter-spacing: 0.5px;
        }

        .amplitude-display .value {
            color: #00e5ff;
            font-weight: bold;
            font-size: 1.15rem;
            display: block;
            margin-top: 1px;
        }

        /* Barra deslizante inferior de frecuencias (0 Hz - 8000 Hz) */
        .frequency-slider-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #7090a0;
        }

        .range-slider {
            width: 100%;
            appearance: none;
            height: 4px;
            background: #283845;
            outline: none;
            border-radius: 2px;
        }

        .range-slider::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 0 6px #00e5ff;
        }
    </style>
</head>
<body>

    <div class="device-screen">
        
        <!-- BARRA SUPERIOR EXACTA -->
        <div class="top-bar">
            <div class="top-brand">AQ-SPEC 1500</div>
            <div class="top-status">System Status: Nominal</div>
            <div class="top-icons">
                <span>📁</span>
                <span>🔊</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- LAYOUT PRINCIPAL -->
        <div class="main-layout">
            
            <!-- PANEL IZQUIERDO -->
            <div class="left-panel">
                <button class="ui-btn active" title="Signal Analyzer">
                    <svg viewBox="0 0 24 24"><path d="M3 3h2v18H3V3zm4 6h2v6H7V9zm4-4h2v14h-2V5zm4 2h2v10h-2V7zm4 4h2v6h-2v-6z"/></svg>
                    <span>Signal Analyzer</span>
                </button>
                <button class="ui-btn" title="Leak Finder">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <span>Leak Finder</span>
                </button>
            </div>

            <!-- VISOR DE ESPECTROGRAMA HORIZONTAL -->
            <div class="spectrogram-container">
                <canvas id="specCanvas"></canvas>
            </div>

            <!-- PANEL DERECHO -->
            <div class="right-panel">
                <button class="ui-btn" title="Data Log">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                    <span>Data Log</span>
                </button>
                <button class="ui-btn" title="Settings">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c-.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    <span>Settings</span>
                </button>
                <button class="ui-btn" title="Home">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>Home</span>
                </button>
            </div>

            <!-- SECCIÓN INFERIOR: TUBERÍA Y VALORES -->
            <div class="pipe-container">
                <div class="sensor-node-label">sensor node</div>

                <div class="pipe-graphic-area">
                    <div class="pipe-drawing">
                        <div class="pipe-valve">
                            <div class="node-dot"></div>
                        </div>
                    </div>
                    <div class="amplitude-display">
                        LEAK SIGNATURE AMPLITUDE:
                        <span class="value" id="ampVal">785</span>
                    </div>
                </div>

                <div class="frequency-slider-wrapper">
                    <div class="slider-labels">
                        <span>0 Hz</span>
                        <span>8000 Hz</span>
                    </div>
                    <input type="range" class="range-slider" min="0" max="8000" value="4000">
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE ANIMACIÓN DEL ESPECTROGRAMA EN TIEMPO REAL -->
    <script>
        const canvas = document.getElementById('specCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const ampVal = document.getElementById('ampVal');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderSpectrogram() {
            // Desplazar la imagen un píxel a la izquierda para crear la cascada horizontal
            const imgData = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);
            ctx.putImageData(imgData, 0, 0);

            const x = canvas.width - 1;
            for (let y = 0; y < canvas.height; y++) {
                let intensity = Math.random() * 25; // Ruido base oscuro

                // Simular picos de bandas acústicas de fugas (similares a la foto de referencia)
                let normY = y / canvas.height;
                if ((normY > 0.2 && normY < 0.8 && Math.random() > 0.82) || 
                    (normY > 0.4 && normY < 0.6 && Math.random() > 0.7)) {
                    intensity = Math.random() * 255;
                }

                // Paleta de colores exacta: Azul oscuro -> Verde militar -> Amarillo brillante -> Blanco
                let r = intensity > 180 ? 255 : (intensity > 90 ? intensity * 1.1 : 0);
                let g = intensity > 60 ? intensity : intensity * 0.5;
                let b = intensity < 150 ? 200 - intensity : 0;

                ctx.fillStyle = `rgb(${Math.min(r, 255)}, ${Math.min(g, 255)}, ${Math.min(b, 255)})`;
                ctx.fillRect(x, y, 1, 1);
            }

            // Variación realista del número de amplitud
            let currentAmp = Math.floor(775 + Math.random() * 20);
            ampVal.innerText = currentAmp;
        }

        // Ejecutar a ~30 cuadros por segundo
        setInterval(renderSpectrogram, 33);
    </script>
</body>
</html>
