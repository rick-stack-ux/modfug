
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQ-SPEC 1500 - Aurumsys SpA</title>
    <style>
        :root {
            --bg-dark: #0b0f12;
            --panel-bg: #13181d;
            --border-color: #2c3e50;
            --accent-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #88a0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- BARRA SUPERIOR DE ESTADO EXACTA --- */
        .top-bar {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 0.95rem;
        }

        .device-id {
            color: var(--text-main);
            font-weight: 500;
        }

        .system-status {
            color: var(--text-main);
        }

        .status-ok {
            color: var(--text-main);
            font-weight: 500;
        }

        .status-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* --- CONTENEDOR PRINCIPAL ADAPTATIVO --- */
        .main-screen {
            flex: 1;
            display: grid;
            grid-template-rows: 62% 38%;
            gap: 6px;
            padding: 8px;
            background-color: #050709;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- SECCIÓN SUPERIOR: 4 COLUMNAS EXACTAS (Botones Izq | Espectrograma | Botones Der) --- */
        .spectrogram-section {
            display: grid;
            grid-template-columns: 90px 1fr 90px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .spectrogram-section {
                grid-template-columns: 80px 1fr 80px;
            }
        }

        .side-panel {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 4px;
        }

        .side-panel.left {
            border-right: 1px solid var(--border-color);
        }

        .side-panel.right {
            border-left: 1px solid var(--border-color);
        }

        /* --- BOTONES E ICONOS EXTRA GRANDES --- */
        .screen-button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            gap: 6px;
            transition: all 0.2s;
            padding: 8px 0;
        }

        .screen-button:hover, .screen-button.active {
            color: var(--accent-blue);
        }

        .screen-button svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .screen-button svg {
                width: 30px;
                height: 30px;
            }
            .screen-button {
                font-size: 0.75rem;
            }
        }

        .canvas-wrapper {
            position: relative;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- SECCIÓN INFERIOR: DIAGRAMA DE TUBERÍA Y VALORES --- */
        .pipe-section {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 20px;
            position: relative;
        }

        .pipe-header-center {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .graphic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
        }

        .pipe-graphic {
            width: 65%;
            max-width: 450px;
            height: 32px;
            background: linear-gradient(to bottom, #546e7a 0%, #37474f 50%, #263238 100%);
            border-top: 2px solid #90a4ae;
            border-bottom: 2px solid #1e272c;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
        }

        .valve-center {
            position: absolute;
            width: 48px;
            height: 52px;
            background: #455a64;
            border: 2px solid #b0bec5;
            top: -12px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sensor-node-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-blue);
            margin-bottom: 2px;
        }

        .leak-amplitude-text {
            position: absolute;
            bottom: 0px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .leak-amplitude-text span {
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
        }

        /* --- BARRA DE FRECUENCIAS INFERIOR --- */
        .freq-slider-bar {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-top: 4px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
            height: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR EXACTA -->
    <div class="top-bar">
        <div class="device-id">AQ-SPEC 1500</div>
        <div class="system-status">System Status: <span class="status-ok">Nominal</span></div>
        <div class="status-icons">
            <span>🗂️</span>
            <span>🔊</span>
            <span>🔋</span>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL ADAPTATIVA -->
    <div class="main-screen">
        
        <!-- SECCIÓN SUPERIOR: Espectrograma Horizontal con Botones Grandes a los Costados -->
        <div class="spectrogram-section">
            <!-- Botones Izquierdos (Grandes) -->
            <div class="side-panel left">
                <button class="screen-button active" title="General Detection">
                    <!-- Icono analizador de ondas -->
                    <svg viewBox="0 0 24 24"><path d="M3 3h2v18H3V3zm4 6h2v6H7V9zm4-4h2v14h-2V5zm4 2h2v10h-2V7zm4 4h2v6h-2v-6z"/></svg>
                    <span>General</span>
                </button>
                <button class="screen-button" id="btnLocation" title="Location Mode">
                    <!-- Icono mira / ubicación -->
                    <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                    <span>Location</span>
                </button>
            </div>

            <!-- Visor del Espectrograma Horizontal (Simulado en tiempo real) -->
            <div class="canvas-wrapper">
                <canvas id="spectrogramCanvas"></canvas>
            </div>

            <!-- Botones Derechos (Grandes) -->
            <div class="side-panel right">
                <button class="screen-button" title="Data Log">
                    <!-- Icono carpeta / registro -->
                    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                    <span>Data Log</span>
                </button>
                <button class="screen-button" title="Settings">
                    <!-- Icono engranaje -->
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- SECCIÓN INFERIOR: Tubería, Nodo y Amplitud EXACTOS -->
        <div class="pipe-section">
            <div class="pipe-header-center">
                <span>sensor node</span>
            </div>

            <div class="graphic-container">
                <div class="pipe-graphic">
                    <div class="valve-center">
                        <div class="sensor-node-dot"></div>
                    </div>
                </div>
                <div class="leak-amplitude-text">
                    LEAK SIGNATURE AMPLITUDE: <span id="amplitudeVal">785</span>
                </div>
            </div>

            <div class="freq-slider-bar">
                <div class="slider-labels">
                    <span>0 Hz</span>
                    <span>8000 Hz</span>
                </div>
                <input type="range" id="freqRange" min="0" max="8000" value="4000">
            </div>
        </div>

    </div>

    <!-- SCRIPT DE SIMULACIÓN DEL ESPECTROGRAMA HORIZONTAL -->
    <script>
        const canvas = document.getElementById('spectrogramCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const amplitudeVal = document.getElementById('amplitudeVal');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Animación fluida de desplazamiento horizontal (de derecha a izquierda)
        function drawHorizontalSpectrogram() {
            // 1. Desplazar imagen un pixel a la izquierda
            const imgData = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);
            ctx.putImageData(imgData, 0, 0);

            // 2. Pintar nueva columna en el borde derecho con bandas de frecuencia simuladas
            const xCoord = canvas.width - 1;
            for (let y = 0; y < canvas.height; y++) {
                let noise = Math.random();
                let intensity = 0;

                // Simular picos de bandas acústicas características de fugas presurizadas
                if (y > canvas.height * 0.25 && y < canvas.height * 0.75 && noise > 0.8) {
                    intensity = Math.random() * 255;
                } else {
                    intensity = Math.random() * 28; // Ruido base del entorno
                }

                // Paleta térmica exacta (Azul profundo -> Verde -> Amarillo brillante -> Blanco)
                let r = intensity > 170 ? 255 : (intensity > 90 ? intensity : 0);
                let g = intensity > 70 ? intensity : intensity * 0.4;
                let b = intensity < 140 ? 255 - intensity : 0;

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fillRect(xCoord, y, 1, 1);
            }

            // Actualizar valor de amplitud en pantalla dinámicamente
            let simulatedAmp = Math.floor(770 + Math.random() * 30);
            amplitudeVal.innerText = simulatedAmp;
        }

        // Ejecutar bucle visual a ~30 cuadros por segundo
        setInterval(drawHorizontalSpectrogram, 33);
    </script>
</body>
</html>
