<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AurumTrap AI - Panel de Control</title>
    <!-- CDN: Tailwind CSS (Estilo Industrial Rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CDN: Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .panel { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1.5rem; }
    </style>
</head>
<body class="p-6">

    <!-- Cabecera -->
    <header class="flex justify-between items-center mb-6 panel">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">AURUMSYS SpA | AurumTrap AI</h1>
            <p class="text-sm text-gray-400">ID Equipo: TRAMPA-001 | Ubicación: Sector A</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                <span id="status-text" class="text-sm font-semibold">Sistema Activo</span>
            </div>
            <button onclick="forzarCaptura()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow">
                Forzar Escaneo
            </button>
        </div>
    </header>

    <!-- Grid Principal -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Columna Izquierda: Visión Artificial -->
        <div class="lg:col-span-2 panel">
            <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2">Última Detección IA</h2>
            <div class="relative w-full bg-black rounded overflow-hidden aspect-video flex justify-center items-center">
                <!-- Imagen alimentada por la ESP32 -->
                <img id="cam-stream" src="/last_jpg" alt="Esperando evento PIR..." class="object-contain h-full">
                <!-- Overlay de Bounding Box simulado -->
                <div id="bbox" class="absolute hidden border-2 border-red-500 bg-red-500/20" style="top: 30%; left: 40%; width: 20%; height: 25%;">
                    <span class="absolute -top-6 left-0 bg-red-500 text-white text-xs px-1 font-mono">Plaga: 94%</span>
                </div>
            </div>
            <div class="mt-4 flex justify-between text-sm text-gray-400">
                <span id="last-time">Último evento: --:--</span>
                <span>Resolución: 96x96 px (TinyML)</span>
            </div>
        </div>

        <!-- Columna Derecha: Datos y Gráficos -->
        <div class="space-y-6">
            <!-- Panel Gráfico -->
            <div class="panel">
                <h2 class="text-lg font-semibold mb-4 text-center">Predominancia Diaria</h2>
                <canvas id="graficoPlagas"></canvas>
            </div>

            <!-- Panel de Log -->
            <div class="panel">
                <h2 class="text-lg font-semibold mb-4">Registro de Eventos</h2>
                <div class="overflow-hidden rounded border border-gray-700">
                    <table class="min-w-full text-sm text-left">
                        <thead class="bg-gray-800 text-gray-400">
                            <tr>
                                <th class="px-4 py-2">Hora</th>
                                <th class="px-4 py-2">Especie</th>
                                <th class="px-4 py-2">Conf.</th>
                            </tr>
                        </thead>
                        <tbody id="log-table" class="divide-y divide-gray-700">
                            <!-- Filas dinámicas -->
                            <tr><td class="px-4 py-2 text-gray-500" colspan="3">Esperando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integración AJAX -->
    <script>
        // Inicialización del Gráfico Chart.js
        const ctx = document.getElementById('graficoPlagas').getContext('2d');
        const plagaChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Orugas', 'Escarabajos', 'Alados', 'Falsos Positivos'],
                datasets: [{
                    data: [0, 0, 0, 0], // Valores iniciales
                    backgroundColor: ['#f87171', '#fbbf24', '#34d399', '#9ca3af'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
        });

        // Función para consultar estado a la ESP32 (Polling)
        async function actualizarDatos() {
            try {
                // En producción, apuntar a tu endpoint real (ej. /api/status)
                const response = await fetch('/api/status'); 
                const data = await response.json();

                // Actualizar Gráfico
                plagaChart.data.datasets[0].data = [data.stats.orugas, data.stats.escarabajos, data.stats.alados, data.stats.fondo];
                plagaChart.update();

                // Actualizar Log
                const tbody = document.getElementById('log-table');
                tbody.innerHTML = '';
                data.logs.forEach(log => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800">
                            <td class="px-4 py-2 text-gray-300">${log.hora}</td>
                            <td class="px-4 py-2 text-white font-medium">${log.especie}</td>
                            <td class="px-4 py-2 ${log.confianza > 80 ? 'text-green-400' : 'text-yellow-400'}">${log.confianza}%</td>
                        </tr>
                    `;
                });

                // Actualizar Imagen (Añade un timestamp para evadir caché del navegador)
                document.getElementById('cam-stream').src = `/last_jpg?t=${new Date().getTime()}`;
                
                // Indicador visual
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                document.getElementById('status-text').innerText = "Sistema Activo";

            } catch (error) {
                console.error("Error conectando con ESP32:", error);
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-red-500";
                document.getElementById('status-text').innerText = "Desconectado";
            }
        }

        function forzarCaptura() {
            // Activar endpoint de captura manual
            fetch('/capture_manual');
            setTimeout(actualizarDatos, 2000);
        }

        // Ejecutar actualización cada 10 segundos
        setInterval(actualizarDatos, 10000);
    </script>
</body>
</html>
